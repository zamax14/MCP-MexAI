id: tasa_informalidad_municipal
nombre: Tasa de informalidad laboral municipal
tema: empleo
definicion: >
  Porcentaje de la población ocupada que trabaja en condiciones de informalidad.
unidad: porcentaje
fuente: Datos sintéticos de demostración (no son cifras oficiales)
base: demo
periodicidad: anual
notas: |
  Valores aleatorios: sirven para probar el flujo, no para sacar conclusiones.
parametros:
  - nombre: cve_geo
    tipo: str
    descripcion: Clave INEGI de 5 dígitos del municipio (ej. 14039). Omitir para todos.
  - nombre: anio_min
    tipo: int
    descripcion: Año inicial de la serie. Omitir para la serie completa.
sql: |
  SELECT
      cve_mun         AS cve_geo,
      municipio       AS nombre_geo,
      anio::text      AS periodo,
      tasa_informalidad::numeric AS valor
  FROM empleo_municipal
  WHERE (CAST(:cve_geo AS text) IS NULL OR cve_mun = CAST(:cve_geo AS text))
    AND (CAST(:anio_min AS integer) IS NULL OR anio >= CAST(:anio_min AS integer))
  ORDER BY cve_geo, periodo

id: pobreza_municipal
nombre: Población en situación de pobreza, municipal
tema: pobreza
definicion: >
  Porcentaje de personas en situación de pobreza multidimensional.
unidad: porcentaje
fuente: Datos sintéticos de demostración (no son cifras oficiales)
base: demo
periodicidad: quinquenal
notas: |
  Solo hay tres cortes: 2010, 2015 y 2020. La ausencia de un año no significa cero.
parametros:
  - nombre: cve_geo
    tipo: str
    descripcion: Clave INEGI de 5 dígitos del municipio (ej. 14039). Omitir para todos.
  - nombre: anio_min
    tipo: int
    descripcion: Año inicial de la serie. Omitir para la serie completa.
sql: |
  SELECT
      cve_mun         AS cve_geo,
      municipio       AS nombre_geo,
      anio::text      AS periodo,
      pobreza_pct::numeric AS valor
  FROM pobreza_municipal
  WHERE (CAST(:cve_geo AS text) IS NULL OR cve_mun = CAST(:cve_geo AS text))
    AND (CAST(:anio_min AS integer) IS NULL OR anio >= CAST(:anio_min AS integer))
  ORDER BY cve_geo, periodo

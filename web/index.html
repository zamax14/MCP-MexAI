<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distribuidora Aurora, portal de consultas</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Sin red la página cae a la fuente del sistema: la demo no depende de esto. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&display=swap">
<style>
  :root {
    color-scheme: light dark;
    --paper: light-dark(#f4f3f8, #121019);
    --surface: light-dark(#ffffff, #1b1826);
    --ink: light-dark(#1b1630, #f2f0f8);
    --ink-2: light-dark(#55506a, #bdb8cf);
    --muted: light-dark(#7d7892, #8c87a0);
    --line: light-dark(#e2dfec, #2e2a3d);
    --brand: light-dark(#5b2ea6, #b79af0);
    --brand-ink: light-dark(#ffffff, #17131f);
    --brand-wash: light-dark(#efe9fa, #2a2340);
    --bar: #1b1630;
    --bar-ink: #f2f0f8;
    --bar-muted: #a9a3c2;
    --warn: light-dark(#8a5a00, #f2c14e);
    --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.5 var(--sans); background: var(--paper); color: var(--ink);
         display: grid; grid-template-rows: auto 1fr; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

  /* Barra superior */
  .bar { background: var(--bar); color: var(--bar-ink); padding: 14px 24px; display: flex; gap: 12px 32px;
         align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .bar h1 { margin: 0; font-size: 1.35rem; font-weight: 800; font-stretch: 118%; letter-spacing: -.01em; }
  .bar p { margin: 0; color: var(--bar-muted); font-size: .85rem; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 99px;
          border: 1px solid #3a3357; font-size: .85rem; }
  .pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #5ed39a; }

  /* Estructura */
  .layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); min-height: 0; }
  aside { border-right: 1px solid var(--line); background: var(--surface); padding: 20px; overflow-y: auto; }
  main { padding: 24px; overflow-y: auto; }
  @media (max-width: 860px) {
    body { display: block; }
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
    main { padding: 16px; }
  }
  .paso { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 1rem; font-weight: 700; }
  aside .paso:not(:first-child) { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .paso b { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
            background: var(--brand); color: var(--brand-ink); font-size: .8rem; }
  .vacio { color: var(--muted); margin: 0; }

  /* Paso 1: el catálogo */
  .buscar { width: 100%; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--paper); margin-bottom: 8px; }
  .sistema { margin: 14px 2px 4px; font-size: .8rem; font-weight: 600; color: var(--muted); }
  .item { display: block; width: calc(100% + 8px); margin: 0 -4px 2px; padding: 8px 10px; border: 0; border-radius: 8px;
          background: none; text-align: left; cursor: pointer; }
  .item:hover { background: var(--paper); }
  .item[aria-current] { background: var(--brand-wash); font-weight: 700; box-shadow: inset 3px 0 var(--brand); }

  /* Paso 2: los filtros */
  form { display: grid; gap: 14px; }
  .campo { display: grid; gap: 4px; font-size: .85rem; font-weight: 700; }
  .campo small { font-weight: 400; color: var(--muted); }
  .campo input { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); width: 100%; }
  .primario { padding: 10px 22px; border: 0; border-radius: 8px; background: var(--brand);
              color: var(--brand-ink); font-weight: 700; cursor: pointer; }
  .primario:hover { filter: brightness(1.1); }

  /* Paso 3: el resultado */
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px; min-width: 0; }
  #resultado { transition: opacity .15s; }
  #resultado.cargando { opacity: .5; }
  .cabecera { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 340px); gap: 16px 40px; align-items: start; }
  @media (max-width: 1100px) { .cabecera { grid-template-columns: minmax(0, 1fr); } }
  .origen { margin: 0 0 4px; color: var(--brand); font-weight: 700; font-size: .9rem; }
  .titulo { margin: 0; font-size: 1.7rem; line-height: 1.15; font-weight: 800; font-stretch: 112%; letter-spacing: -.015em; }
  .descripcion { margin: 8px 0 0; color: var(--ink-2); max-width: 70ch; }
  .nota { margin: 0; padding: 8px 14px; border-left: 3px solid var(--warn); background: var(--paper);
          border-radius: 0 8px 8px 0; font-size: .9rem; }
  [role="alert"] { color: var(--warn); font-weight: 700; }

  /* La petición que esta página le hizo a la API */
  .peticion { margin: 20px 0 0; background: var(--bar); color: var(--bar-ink); border-radius: 10px; padding: 12px 16px;
              display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 14px; align-items: start; }
  .peticion p { margin: 0; grid-column: 1 / -1; color: var(--bar-muted); font-size: .8rem; }
  .peticion code { font: 13px/1.5 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; }
  .peticion button { border: 1px solid #3a3357; background: none; color: var(--bar-ink); border-radius: 6px;
                     padding: 2px 10px; cursor: pointer; font-size: .8rem; }
  .peticion button:hover { background: #2a2346; }
  .peticion :focus-visible { outline-color: #f5c518; }

  /* Tabla */
  .acciones { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin: 24px 0 8px; }
  .acciones p { margin: 0; color: var(--muted); font-size: .85rem; }
  .secundario { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
  .secundario:hover { border-color: var(--brand); }
  .tabla { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; font-variant-numeric: tabular-nums; }
  th, td { padding: 8px 14px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 600; font-size: .85rem; background: var(--paper); }
  tbody tr:hover { background: var(--paper); }
  .num { text-align: right; }
</style>
</head>
<body>
<header class="bar">
  <div>
    <h1>Distribuidora Aurora</h1>
    <p>Portal interno de consultas. Empresa y datos de demostración.</p>
  </div>
  <span class="pill">Conectado a la API REST</span>
</header>

<div class="layout">
  <aside>
    <h2 class="paso"><b>1</b> Elige una consulta</h2>
    <input class="buscar" id="buscar" type="search" placeholder="Buscar" aria-label="Buscar en el catálogo de consultas">
    <nav id="catalogo" aria-label="Catálogo de consultas"></nav>
    <h2 class="paso"><b>2</b> Acota el resultado</h2>
    <div id="filtros"></div>
  </aside>

  <main>
    <section class="panel">
      <h2 class="paso"><b>3</b> Resultado</h2>
      <div id="resultado" aria-live="polite"></div>
    </section>
  </main>
</div>

<script>
// Este portal solo conoce tres rutas de la API REST:
//   GET  /v1/consultas              el catálogo
//   GET  /v1/consultas/{id}         qué devuelve una consulta y qué filtros acepta
//   POST /v1/consultas/{id}/datos   sus filas
// No hay una pantalla programada por consulta: la lista, los filtros y la tabla salen de esas respuestas.

const $ = id => document.getElementById(id);
const SISTEMAS = { ventas: "Punto de venta", almacen: "Almacén", soporte: "Mesa de ayuda" };
const TIPOS_INPUT = { int: "number", date: "date", str: "text" };
const fechaCorta = new Intl.DateTimeFormat("es-MX", { day: "numeric", month: "short", year: "numeric" });

const estado = {
  catalogo: [],      // respuesta de GET /v1/consultas
  ficha: null,       // respuesta de GET /v1/consultas/{id} para la consulta elegida
  parametros: {},    // nombre -> texto escrito en el formulario
};

// Todo lo que viene de la API entra como nodo de texto, nunca como HTML.
function el(tag, props = {}, ...hijos) {
  const nodo = Object.assign(document.createElement(tag), props);
  nodo.append(...hijos.flat());
  return nodo;
}

async function api(ruta, opciones) {
  const respuesta = await fetch(ruta, opciones);
  const cuerpo = await respuesta.json();
  if (!respuesta.ok) throw new Error(cuerpo.detail || respuesta.statusText);
  return cuerpo;
}

/* ---------- La consulta vive en la URL: recargar o compartir el enlace la conserva ---------- */

function leerUrl() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const parametros = {};
  for (const [clave, valor] of hash) if (clave.startsWith("p.")) parametros[clave.slice(2)] = valor;
  return { id: hash.get("c"), parametros };
}

function escribirUrl() {
  const hash = new URLSearchParams({ c: estado.ficha.id });
  for (const [nombre, valor] of Object.entries(estado.parametros)) hash.set("p." + nombre, valor);
  history.replaceState(null, "", "#" + hash);
}

/* ---------- Paso 1: el catálogo ---------- */

function pintarCatalogo() {
  const filtro = $("buscar").value.trim().toLowerCase();
  const visibles = estado.catalogo.filter(c => `${c.nombre} ${c.descripcion} ${c.sistema}`.toLowerCase().includes(filtro));
  // Primero los sistemas que el portal conoce por nombre; uno nuevo aparece al final con su clave.
  const sistemas = [...new Set([...Object.keys(SISTEMAS), ...visibles.map(c => c.sistema)])]
    .filter(sistema => visibles.some(c => c.sistema === sistema));

  $("catalogo").replaceChildren(...(sistemas.length ? sistemas.flatMap(sistema => [
    el("p", { className: "sistema", textContent: SISTEMAS[sistema] ?? sistema }),
    ...visibles.filter(c => c.sistema === sistema).map(consulta => {
      const boton = el("button", { className: "item", type: "button", textContent: consulta.nombre, title: consulta.descripcion });
      boton.dataset.id = consulta.id;
      if (consulta.id === estado.ficha?.id) boton.setAttribute("aria-current", "true");
      boton.addEventListener("click", () => elegir(consulta.id));
      return boton;
    }),
  ]) : [el("p", { className: "vacio", textContent: "Ninguna consulta coincide con la búsqueda." })]));
}

async function elegir(id, parametros = {}) {
  try {
    estado.ficha = await api(`/v1/consultas/${encodeURIComponent(id)}`);
  } catch (error) {
    $("resultado").replaceChildren(el("p", { role: "alert", textContent: error.message }));
    return;
  }
  estado.parametros = parametros;
  pintarCatalogo();
  pintarFiltros();
  // Se ejecuta de entrada, salvo que la consulta exija algún filtro que todavía no se ha llenado.
  if (estado.ficha.parametros.every(p => !p.requerido || estado.parametros[p.nombre])) ejecutar();
  else pintarCabecera(el("p", { className: "vacio", textContent: "Llena los filtros marcados con * y consulta." }));
}

/* ---------- Paso 2: los filtros, generados de los parámetros que declara la consulta ---------- */

function pintarFiltros() {
  const declarados = estado.ficha.parametros;
  if (!declarados.length) {
    $("filtros").replaceChildren(el("p", { className: "vacio", textContent: "Esta consulta no tiene filtros." }));
    return;
  }
  const form = el("form", {}, declarados.map(p =>
    el("label", { className: "campo" }, p.nombre + (p.requerido ? " *" : ""),
      el("input", { name: p.nombre, type: TIPOS_INPUT[p.tipo] ?? "text", required: p.requerido, value: estado.parametros[p.nombre] ?? "" }),
      el("small", { textContent: p.descripcion }))),
    el("button", { className: "primario", type: "submit", textContent: "Consultar" }));
  form.addEventListener("submit", evento => {
    evento.preventDefault();
    estado.parametros = {};
    for (const [nombre, valor] of new FormData(form)) if (valor !== "") estado.parametros[nombre] = valor;
    ejecutar();
  });
  $("filtros").replaceChildren(form);
}

// Los valores salen con el tipo que declara la consulta; uno mal escrito se manda tal cual
// para que sea la API quien diga qué está mal.
function parametrosTipados() {
  const salida = {};
  for (const p of estado.ficha.parametros) {
    const valor = estado.parametros[p.nombre];
    if (valor !== undefined) salida[p.nombre] = p.tipo === "int" && !Number.isNaN(Number(valor)) ? Number(valor) : valor;
  }
  return salida;
}

/* ---------- Paso 3: el resultado ---------- */

async function ejecutar() {
  escribirUrl();
  const { id } = estado.ficha;
  $("resultado").classList.add("cargando");   // se conserva el resultado anterior mientras llega el nuevo
  try {
    const datos = await api(`/v1/consultas/${encodeURIComponent(id)}/datos`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ parametros: parametrosTipados() }),
    });
    if (id === estado.ficha.id) pintarCabecera(...pintarTabla(id, datos.filas));   // por si ya se eligió otra
  } catch (error) {
    pintarCabecera(el("p", { role: "alert", textContent: error.message }));
  }
  $("resultado").classList.remove("cargando");
}

function pintarCabecera(...contenido) {
  const { ficha } = estado;
  $("resultado").replaceChildren(
    el("div", { className: "cabecera" },
      el("div", {},
        el("p", { className: "origen", textContent: SISTEMAS[ficha.sistema] ?? ficha.sistema }),
        el("h3", { className: "titulo", textContent: ficha.nombre }),
        el("p", { className: "descripcion", textContent: ficha.descripcion })),
      ficha.notas ? el("p", { className: "nota", textContent: ficha.notas }) : []),
    pintarPeticion(),
    ...contenido);
}

function pintarPeticion() {
  const ruta = `/v1/consultas/${estado.ficha.id}/datos`;
  const cuerpo = JSON.stringify({ parametros: parametrosTipados() });
  const copiar = el("button", { type: "button", textContent: "Copiar como curl" });
  copiar.addEventListener("click", async () => {
    await navigator.clipboard.writeText(`curl -X POST ${location.origin}${ruta} -H 'Content-Type: application/json' -d '${cuerpo}'`);
    copiar.textContent = "Copiado";
    setTimeout(() => { copiar.textContent = "Copiar como curl"; }, 1500);
  });
  return el("div", { className: "peticion" },
    el("p", { textContent: "Lo que esta página le pidió a la API" }),
    el("code", { textContent: `POST ${ruta}\n${cuerpo}` }), copiar);
}

// Cómo se muestra cada columna se decide por sus valores: números a la derecha y con los
// mismos decimales, fechas en corto, lo demás tal cual.
function formatoDe(filas, columna) {
  const valores = filas.map(fila => fila[columna]).filter(valor => valor != null);
  if (valores.length && valores.every(valor => typeof valor === "number")) {
    const decimales = Math.min(2, Math.max(0, ...valores.map(v => (String(v).split(".")[1] ?? "").length)));
    const numero = new Intl.NumberFormat("es-MX", { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
    return { clase: "num", texto: valor => numero.format(valor) };
  }
  if (valores.length && valores.every(valor => /^\d{4}-\d{2}-\d{2}$/.test(valor))) {
    return { clase: "", texto: valor => fechaCorta.format(new Date(`${valor}T00:00`)) };
  }
  return { clase: "", texto: String };
}

function pintarTabla(id, filas) {
  if (!filas.length) return [el("p", { className: "vacio", style: "margin-top: 24px", textContent: "Ninguna fila cumple con estos filtros." })];

  const columnas = Object.keys(filas[0]);
  const formatos = columnas.map(columna => formatoDe(filas, columna));

  const descargar = el("button", { className: "secundario", type: "button", textContent: "Descargar CSV" });
  descargar.addEventListener("click", () => {
    const celda = valor => `"${String(valor ?? "").replaceAll('"', '""')}"`;
    const csv = [columnas, ...filas.map(fila => columnas.map(c => fila[c]))].map(f => f.map(celda).join(",")).join("\n");
    const enlace = el("a", { href: URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })), download: `${id}.csv` });
    enlace.click();
    URL.revokeObjectURL(enlace.href);
  });

  return [
    el("div", { className: "acciones" },
      el("p", { textContent: `${filas.length.toLocaleString("es-MX")} ${filas.length === 1 ? "fila" : "filas"}` }), descargar),
    el("div", { className: "tabla" }, el("table", {},
      el("thead", {}, el("tr", {}, columnas.map((columna, i) => el("th", { scope: "col", className: formatos[i].clase, textContent: columna })))),
      el("tbody", {}, filas.map(fila => el("tr", {}, columnas.map((columna, i) =>
        el("td", { className: formatos[i].clase, textContent: fila[columna] == null ? "—" : formatos[i].texto(fila[columna]) }))))))),
  ];
}

/* ---------- Arranque ---------- */

async function arrancar() {
  try {
    estado.catalogo = await api("/v1/consultas");
  } catch (error) {
    $("catalogo").replaceChildren(el("p", { role: "alert", textContent: `No se pudo leer el catálogo: ${error.message}` }));
    return;
  }
  pintarCatalogo();
  // La página abre con datos: si el enlace no trae consulta, se elige la primera de la lista.
  const { id, parametros } = leerUrl();
  const inicial = estado.catalogo.some(c => c.id === id) ? id : $("catalogo").querySelector(".item")?.dataset.id;
  if (inicial) elegir(inicial, inicial === id ? parametros : {});
}

$("buscar").addEventListener("input", pintarCatalogo);
arrancar();
</script>
</body>
</html>
